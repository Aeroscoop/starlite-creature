# Zoekt naar geheimen (sleutels, tokens) in de code, bij elke push en PR.
# Dit account is een persoonlijk account, dus de officiële action werkt zonder licentie.
# Verhuist de repo naar een organisatie? Dan vraagt gitleaks-action een licentiesleutel:
# draai dan de gitleaks-CLI direct in plaats van deze action.
name: Gitleaks
on:
  push:
  pull_request:
permissions:
  contents: read
  pull-requests: read
jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
